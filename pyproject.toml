[project]
name = "approved-sql-rag-agent"
version = "0.1.0"
description = "RAG agent that retrieves and safely executes approved SQL"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40,<1",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "fastembed>=0.4,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "sqlglot>=26,<29",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
sync-approved-queries = "app.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
